name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Foundation tests
        run: bash scripts/test.sh
      - name: Build universal Intel + Apple Silicon app
        run: UNIVERSAL=1 bash scripts/build.sh
      - name: Verify architectures
        run: lipo -info 'build/Mawaqit Island.app/Contents/MacOS/MawaqitIsland'
      - name: Package ZIP
        run: ditto -c -k --sequesterRsrc --keepParent 'build/Mawaqit Island.app' 'build/Mawaqit-Island-macOS-universal.zip'
      - name: Create drag-to-Applications DMG
        run: bash scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mawaqit-Island-macOS-installers
          path: |
            build/Mawaqit-Island-macOS-universal.dmg
            build/Mawaqit-Island-macOS-universal.zip
